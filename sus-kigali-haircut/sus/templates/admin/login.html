<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="robots" content="noindex, nofollow">
  <title>Log in — SUS KIGALI HAIRCUT Admin</title>

  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">

  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{{ url_for('static', filename='fonts/fraunces-100_900-normal.woff2') }}">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{{ url_for('static', filename='fonts/manrope-200_800-normal.woff2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>SUS <span>ADMIN</span></h1>
    <p class="muted">SUS Kigali Haircut — Business Management</p>
    {% if error %}<p class="error-msg" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <label>Email
        <input type="email" name="email" required autofocus
               placeholder="owner@suskigali.rw">
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn-gold btn-lg">Log in</button>
    </form>
    <a class="back-link" href="{{ url_for('public.home') }}">← Back to website</a>
  </div>
</body>
</html>
