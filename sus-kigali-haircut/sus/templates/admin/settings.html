{% extends "admin/base_admin.html" %}
{% block title %}Settings — SUS Admin{% endblock %}
{% block content %}
<h1>Business Settings</h1>
<p class="muted">Everything configurable without touching code — super admin only.</p>

<form method="post" action="{{ url_for('admin.settings_save') }}">
  <div class="panel">
    <h2>Shop identity (public website)</h2>
    <div class="form-grid">
      <label>Shop name<input name="shop_name" value="{{ settings.shop_name }}"></label>
      <label>Tagline<input name="tagline" value="{{ settings.tagline }}"></label>
      <label>Phone<input name="phone" value="{{ settings.phone }}"></label>
      <label>WhatsApp<input name="whatsapp" value="{{ settings.whatsapp }}"></label>
      <label>Address<input name="address" value="{{ settings.address }}"></label>
      <label>Opening hours<input name="hours" value="{{ settings.hours }}"></label>
    </div>
  </div>

  <div class="panel">
    <h2>Commission &amp; payroll rules</h2>
    <div class="form-grid">
      <label>Default commission rate (%)
        <input type="number" name="default_commission_rate" step="0.5" value="{{ settings.default_commission_rate }}"></label>
      <label>Commission on discounted price?
        <select name="commission_on_discounted">
          <option value="1" {% if settings.commission_on_discounted == '1' %}selected{% endif %}>Yes — pay commission on amount actually collected</option>
          <option value="0" {% if settings.commission_on_discounted == '0' %}selected{% endif %}>No — pay commission on original price</option>
        </select></label>
      <label>Restrict workers to their service category?
        <select name="restrict_service_category">
          <option value="0" {% if settings.restrict_service_category == '0' %}selected{% endif %}>No — anyone can perform any service</option>
          <option value="1" {% if settings.restrict_service_category == '1' %}selected{% endif %}>Yes — workers only record their own category</option>
        </select></label>
      <label>Pay period
        <select name="pay_period">
          {% for p in ['daily', 'weekly', 'bi-weekly', 'monthly'] %}
          <option value="{{ p }}" {% if settings.pay_period == p %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select></label>
      <label>Loyalty: visits needed for reward
        <input type="number" name="loyalty_visits_for_reward" value="{{ settings.loyalty_visits_for_reward }}"></label>
      <label>Currency
        <select name="currency">
          <option value="RWF" {% if settings.currency == 'RWF' %}selected{% endif %}>RWF (Rwandan Franc)</option>
          <option value="USD" {% if settings.currency == 'USD' %}selected{% endif %}>USD</option>
        </select></label>
    </div>
  </div>

  <button class="btn-gold btn-lg" type="submit">Save settings</button>
</form>
{% endblock %}
